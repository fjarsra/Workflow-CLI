name: CI/CD Training Pipeline (Fix with MLflow Run)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
  DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/submission-mlops-model

jobs:
  train-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install mlflow dagshub pandas scikit-learn xgboost matplotlib seaborn
          # Install virtualenv jaga-jaga kalau mlflow run butuh
          pip install virtualenv

      # ========================================================
      # 1. Jalankan Training (SESUAI REQUEST REVIEWER: mlflow run)
      # ========================================================
      - name: Run Training via MLflow Project
        run: |
          cd MLProject
          
          
          mlflow run . --env-manager=local --experiment-name="Final_Submission"

      # 2. Ambil Run ID (File ini dihasilkan oleh script python di dalam mlflow run)
      - name: Get Run ID
        run: |
          cd MLProject
          if [ -f run_id.txt ]; then
            run_id=$(cat run_id.txt)
            echo "RUN_ID=$run_id" >> $GITHUB_ENV
            echo "✅ Run ID Found: $run_id"
          else
            echo "⚠️ run_id.txt not found!"
          fi

      # 3. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build & Push Docker (OFFLINE MODE - Anti Error 404)
      # Menggunakan folder 'model_docker' yang digenerate script python secara lokal
      - name: Build & Push Docker
        run: |
          cd MLProject
          
          # Lowercase nama image
          LOWER_IMAGE_NAME=$(echo "${{ env.DOCKER_IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "Building Docker Image: $LOWER_IMAGE_NAME from local folder"

          # Build dari folder lokal "model_docker"
          # Pastikan modelling.py kamu melakukan save ke folder ini!
          mlflow models build-docker \
            -m "model_docker" \
            -n "$LOWER_IMAGE_NAME:latest"

          docker push "$LOWER_IMAGE_NAME:latest"

      # 5. Simpan Artefak ke GitHub
      - name: Commit Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "bot@noreply.github.com"
          cd MLProject
          
          # Add semua png kalau ada
          git add *.png || true
          
          git commit -m "Auto-save artifacts [skip ci]" || echo "No changes to commit"
          git push